<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robotron 2027 - Digital Pass</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f4ead5;
            --red: #bb0013;
            --yellow: #fddc00;
            --dark: #1a1a1a;
            --success: #00c853;
            --card: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Bricolage Grotesque', sans-serif;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
            background-image: radial-gradient(#1a1a1a 0.75px, transparent 0.75px);
            background-size: 16px 16px;
        }

        .receipt-card {
            background: var(--card);
            width: 100%;
            max-width: 400px;
            border: 4px solid var(--dark);
            box-shadow: 8px 8px 0px var(--dark);
            overflow: hidden;
        }

        .header {
            background: var(--red);
            padding: 20px 24px;
            text-align: center;
            border-bottom: 4px solid var(--dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-family: 'Anton', sans-serif;
            font-size: 1.3rem;
            color: white;
            margin: 0;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header .pass-id {
            background: var(--yellow);
            color: var(--dark);
            font-family: 'Anton', sans-serif;
            font-size: 0.7rem;
            padding: 4px 10px;
            border: 2px solid var(--dark);
            letter-spacing: 1px;
        }

        .content { padding: 24px; }

        #disp-event {
            text-align: center;
            font-family: 'Anton', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
            color: var(--dark);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin: 20px 0;
        }

        .detail-item label {
            display: block;
            font-size: 0.65rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .detail-item span {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .qr-section {
            background: var(--bg);
            padding: 20px;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            text-align: center;
            margin-top: 16px;
        }

        .qr-wrapper {
            background: white;
            padding: 10px;
            display: inline-block;
            border: 3px solid var(--dark);
            line-height: 0;
        }

        .qr-wrapper img { width: 180px; height: 180px; }

        .qr-label {
            font-family: 'Anton', sans-serif;
            font-size: 0.75rem;
            color: var(--red);
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .event-tag {
            display: inline-block;
            background: var(--yellow);
            color: var(--dark);
            font-family: 'Anton', sans-serif;
            font-size: 0.75rem;
            padding: 4px 12px;
            border: 2px solid var(--dark);
            margin-top: 12px;
            letter-spacing: 1px;
        }

        .footer-strip {
            background: var(--dark);
            color: white;
            padding: 10px;
            text-align: center;
            font-family: 'Anton', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 2px;
            border-top: 4px solid var(--dark);
        }
        .footer-strip span { color: var(--yellow); }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 24px;
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border: 3px solid var(--dark);
            box-shadow: 4px 4px 0px var(--dark);
            cursor: pointer;
            transition: all 0.15s;
        }
        .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--dark); }
        .btn:active { transform: translate(4px, 4px); box-shadow: none; }

        .btn-download {
            background: var(--red);
            color: white;
        }
        .btn-print {
            background: white;
            color: var(--dark);
        }

        @media print {
            .button-group { display: none; }
            body { background: var(--bg) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .receipt-card { box-shadow: none; border: 4px solid var(--dark); }
            .qr-section { box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="receipt-card" id="passContent">
        <div class="header">
            <h1>ROBOTRON 2027</h1>
            <div class="pass-id" id="passId">LOADING...</div>
        </div>
        <div class="content">
            <div id="disp-event">Symposium Access</div>
            
            <div class="detail-grid">
                <div class="detail-item">
                    <label>Team</label>
                    <span id="disp-name">Loading...</span>
                </div>
                <div class="detail-item">
                    <label>Team ID</label>
                    <span id="disp-id" style="color:var(--red)">Loading...</span>
                </div>
                <div class="detail-item">
                    <label>Date</label>
                    <span>Jan 15-16, 2026</span>
                </div>
                <div class="detail-item">
                    <label>Status</label>
                    <span style="color:var(--success)">VERIFIED</span>
                </div>
            </div>
            
            <div class="qr-section">
                <div class="qr-wrapper">
                    <img id="disp-qr" src="" alt="QR Code">
                </div>
                <div class="qr-label">Scan at Entry Gate</div>
                <div class="event-tag" id="eventTag">SYMPOSIUM PASS</div>
            </div>
        </div>
        <div class="footer-strip">
            <span>ROBOTRON 2027</span> &mdash; PARK COLLEGE OF ENGINEERING, COIMBATORE
        </div>
    </div>

    <div class="button-group">
        <button class="btn btn-download" onclick="downloadPass()">Save as Image</button>
        <button class="btn btn-print" onclick="window.print()">Print PDF</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const regId = params.get('id') || 'ROBO-OFFLINE';
        const teamName = params.get('team') || 'Team';
        const eventName = params.get('event') || 'Robotron 2027';

        document.getElementById('disp-name').textContent = teamName;
        document.getElementById('disp-id').textContent = regId;
        document.getElementById('disp-event').textContent = eventName;
        document.getElementById('passId').textContent = regId;
        document.getElementById('eventTag').textContent = eventName.toUpperCase();

        const qrImg = document.getElementById('disp-qr');
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${regId}`;

        function downloadPass() {
            const pass = document.getElementById('passContent');
            html2canvas(pass, {
                backgroundColor: '#f4ead5',
                scale: 3,
                useCORS: true,
                allowTaint: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `Robotron_Pass_${regId}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
